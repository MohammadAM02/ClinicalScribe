name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Fetch sherpa-onnx native libraries
        shell: bash
        run: |
          set -euo pipefail
          version='1.13.8'
          archive="sherpa-onnx-v${version}-android.tar.bz2"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${version}/${archive}"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          tar -xjf "$archive"
          cp jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          rm -rf "$archive" jniLibs "sherpa-onnx-v${version}-android"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clinical-scribe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
